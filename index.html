<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nitrox • Planificador</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body { background: linear-gradient(135deg, #0a1625, #1e3a5f); font-family: 'Inter', system-ui, sans-serif; }
    .ocean-bg {
      background: url('background.jpg') center/cover no-repeat;
      opacity: 0.22;
      filter: brightness(0.85) contrast(1.1);
    }
    .glass {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .option-btn { transition: all 0.2s ease; }
    .option-btn.active {
      background-color: #22d3ee;
      color: #0f172a;
      transform: scale(1.05);
    }
    .flag {
      width: 28px;
      height: 19px;
      object-fit: cover;
      border-radius: 3px;
      border: 1px solid rgba(255,255,255,0.25);
      transition: transform 0.2s;
    }
    .flag:hover { transform: scale(1.2); }
    .unit-btn {
      transition: all 0.2s ease;
    }
    .unit-btn.active {
      background-color: #22d3ee;
      color: #0f172a;
      transform: scale(1.05);
    }
    .tooltip {
      position: fixed; 
      top: 50%; 
      left: 50%; 
      transform: translate(-50%, -50%);
      background: rgba(15, 23, 42, 0.98); 
      border: 2px solid #ef4444;
      padding: 2.5rem; 
      border-radius: 20px; 
      max-width: 920px;
      width: 95%;
      text-align: center; 
      box-shadow: 0 0 40px rgba(239, 68, 68, 0.6);
      z-index: 1000; 
      display: none; 
      font-size: 1.2rem; 
      line-height: 1.6;
    }
    .signature {
      position: fixed; bottom: 20px; right: 30px;
      color: rgba(255, 255, 255, 0.4); font-size: 0.8rem; z-index: 10;
    }

    @media (max-width: 640px) {
      .top-bar { flex-direction: column; gap: 12px; align-items: center; }
      .flag { width: 32px; height: 22px; }
    }
  </style>
</head>
<body class="min-h-screen text-white">
  <div class="ocean-bg fixed inset-0 z-0"></div>
  
  <div class="relative z-10 max-w-4xl mx-auto p-6">
    <!-- Top Bar -->
    <div class="top-bar flex items-center justify-between mb-8 pt-4">
      <!-- Left spacer -->
      <div class="w-20"></div>

      <!-- Centered Title -->
      <div class="text-center flex-1">
        <h1 class="text-4xl md:text-5xl font-bold flex items-center justify-center gap-3">
          <i class="fas fa-water text-cyan-400"></i>
          Nitrox
        </h1>
        <p id="subtitle" class="text-cyan-300 text-lg md:text-xl mt-1">Planificador de Busseig amb Nitrox</p>
      </div>

      <!-- Right side: Flags + Units -->
      <div class="flex gap-3 items-center flex-shrink-0">
        <button onclick="setLanguage('ca')" class="hover:scale-110 transition" title="Català">
          <img src="https://upload.wikimedia.org/wikipedia/commons/0/0a/Flag_of_Catalonia_in_PNG.png" class="flag" alt="Bandera Catalana">
        </button>
        <button onclick="setLanguage('en')" class="hover:scale-110 transition" title="English">
          <img src="https://upload.wikimedia.org/wikipedia/commons/d/de/Flag_of_the_United_States.png" class="flag" alt="USA Flag">
        </button>
        
        <div class="flex border border-white/30 rounded-xl overflow-hidden ml-2">
          <button onclick="setUnit(true)" id="metric-btn" class="unit-btn active px-4 py-2 text-sm font-medium">m</button>
          <button onclick="setUnit(false)" id="imperial-btn" class="unit-btn px-4 py-2 text-sm font-medium">ft</button>
        </div>
      </div>
    </div>

    <button id="disclaimer-btn" class="mx-auto block bg-red-600 hover:bg-red-700 transition-all px-6 py-2 rounded-2xl text-sm font-semibold flex items-center gap-2">
      <i class="fas fa-exclamation-triangle"></i>
      <span id="disclaimer-text">Avís de Seguretat</span>
    </button>

    <div class="grid md:grid-cols-2 gap-8 mt-10">
      <div class="glass rounded-3xl p-8">
        <h2 id="input-title" class="text-2xl font-semibold mb-6">Entrada de paràmetres</h2>
        
        <div class="space-y-8">
          <div>
            <label id="mode-label" class="block text-sm text-cyan-300 mb-3">Mode de Càlcul</label>
            <div class="grid grid-cols-2 gap-3">
              <button onclick="setMode(1)" id="mode1" class="option-btn active w-full py-4 rounded-2xl text-lg font-medium border border-white/20">Profunditat Màxima</button>
              <button onclick="setMode(2)" id="mode2" class="option-btn w-full py-4 rounded-2xl text-lg font-medium border border-white/20">Millor %O₂</button>
            </div>
          </div>

          <div id="input1">
            <label id="o2-label" class="block text-sm text-cyan-300 mb-2">% Oxigen (FO₂)</label>
            <input type="number" id="o2" value="32" step="0.1" class="w-full bg-white/10 border border-white/20 rounded-2xl p-4 text-2xl">
          </div>

          <div id="input2">
            <label id="depth-label" class="block text-sm text-cyan-300 mb-2">Profunditat Màxima</label>
            <input type="number" id="depth" value="30" step="1" class="w-full bg-white/10 border border-white/20 rounded-2xl p-4 text-2xl">
            <span id="depth-unit" class="text-xs text-cyan-300">metres</span>
          </div>

          <div>
            <label id="ppo2-label" class="block text-sm text-cyan-300 mb-3">PPO₂ Màxim</label>
            <div class="grid grid-cols-3 gap-3">
              <button onclick="setPPO2(1.2)" id="ppo2_1.2" class="option-btn w-full py-4 rounded-2xl text-lg font-medium border border-white/20">1.2</button>
              <button onclick="setPPO2(1.4)" id="ppo2_1.4" class="option-btn active w-full py-4 rounded-2xl text-lg font-medium border border-white/20">1.4</button>
              <button onclick="setPPO2(1.6)" id="ppo2_1.6" class="option-btn w-full py-4 rounded-2xl text-lg font-medium border border-white/20">1.6</button>
            </div>
          </div>
        </div>
      </div>

      <div class="glass rounded-3xl p-8">
        <h2 id="results-title" class="text-2xl font-semibold mb-6">Resultats</h2>
        <div id="results" class="space-y-6 text-lg"></div>
      </div>
    </div>
  </div>

  <div class="signature">by JGR - 2022-2026</div>

  <div id="tooltip" class="tooltip"></div>

  <script>
    let currentMode = 1;
    let currentPPO2 = 1.4;
    let currentLang = 'ca';
    let isMetric = true;

    const translations = {
      ca: {
        subtitle: "Planificador de Busseig amb Nitrox",
        disclaimer: "Avís de Seguretat",
        inputTitle: "Entrada de paràmetres",
        modeLabel: "Mode de Càlcul",
        maxDepthBtn: "Profunditat Màxima",
        bestO2Btn: "Millor %O₂",
        o2Label: "% Oxigen (FO₂)",
        depthLabel: "Profunditat Màxima",
        depthUnit: "metres",
        ppo2Label: "PPO₂ Màxim",
        resultsTitle: "Resultats",
        modTitle: "Profunditat Operativa Màxima",
        bestMixTitle: "Mescla de Nitrox Recomanada",
        tooltip: "☠️☠️⚠️⚠️ <strong>UTILITZA NITROX NOMÉS SI ESTÀS CERTIFICAT EN NITROX</strong> ⚠️⚠️☠️☠️<br><br>AVÍS: L'AUTOR NO ÉS RESPONSABLE DE CAP ACCIDENT."
      },
      en: {
        subtitle: "Nitrox Dive Planner",
        disclaimer: "Safety Disclaimer",
        inputTitle: "Input Parameters",
        modeLabel: "Calculation Mode",
        maxDepthBtn: "Max Depth",
        bestO2Btn: "Best %O₂",
        o2Label: "% Oxygen (FO₂)",
        depthLabel: "Maximum Depth",
        depthUnit: "feet",
        ppo2Label: "Max PPO₂",
        resultsTitle: "Results",
        modTitle: "Maximum Operating Depth",
        bestMixTitle: "Recommended Nitrox Mix",
        tooltip: "☠️☠️⚠️⚠️ <strong>ONLY USE NITROX IF YOU'RE NITROX CERTIFIED</strong> ⚠️⚠️☠️☠️<br><br>DISCLAIMER: THE AUTHOR IS NOT RESPONSIBLE FOR ANY ACCIDENTS."
      }
    };

    function setLanguage(lang) {
      currentLang = lang;
      const t = translations[lang];
      
      document.getElementById('subtitle').textContent = t.subtitle;
      document.getElementById('disclaimer-text').textContent = t.disclaimer;
      document.getElementById('input-title').textContent = t.inputTitle;
      document.getElementById('mode-label').textContent = t.modeLabel;
      document.getElementById('mode1').textContent = t.maxDepthBtn;
      document.getElementById('mode2').textContent = t.bestO2Btn;
      document.getElementById('o2-label').textContent = t.o2Label;
      document.getElementById('depth-label').textContent = t.depthLabel;
      document.getElementById('depth-unit').textContent = t.depthUnit;
      document.getElementById('ppo2-label').textContent = t.ppo2Label;
      document.getElementById('results-title').textContent = t.resultsTitle;
      document.getElementById('tooltip').innerHTML = t.tooltip;

      calculate();
    }

    function setUnit(metric) {
      isMetric = metric;
      document.getElementById('metric-btn').classList.toggle('active', metric);
      document.getElementById('imperial-btn').classList.toggle('active', !metric);
      document.getElementById('depth-unit').textContent = isMetric ? "metres" : "feet";
      calculate();
    }

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('mode1').classList.toggle('active', mode === 1);
      document.getElementById('mode2').classList.toggle('active', mode === 2);
      document.getElementById('input1').style.display = mode === 1 ? "block" : "none";
      document.getElementById('input2').style.display = mode === 2 ? "block" : "none";
      calculate();
    }

    function setPPO2(ppo2) {
      currentPPO2 = ppo2;
      document.getElementById('ppo2_1.2').classList.toggle('active', ppo2 === 1.2);
      document.getElementById('ppo2_1.4').classList.toggle('active', ppo2 === 1.4);
      document.getElementById('ppo2_1.6').classList.toggle('active', ppo2 === 1.6);
      calculate();
    }

    function calculate() {
      let o2 = parseFloat(document.getElementById('o2').value) || 32;
      let depth = parseFloat(document.getElementById('depth').value) || 30;
      const ppo2 = currentPPO2;
      const t = translations[currentLang];

      let resultHTML = '';

      if (currentMode === 1) {
        const fo2 = o2 / 100;
        let ata = ppo2 / fo2;
        let finalDepth = (ata - 1) * 10;
        if (!isMetric) finalDepth = finalDepth * 3.28084;
        finalDepth = Math.floor(finalDepth);

        resultHTML = `
          <div class="bg-emerald-900/60 rounded-2xl p-6">
            <p class="text-emerald-300 text-sm">${t.modTitle}</p>
            <p class="text-6xl font-bold text-white">${finalDepth}<span class="text-3xl">${isMetric ? 'm' : 'ft'}</span></p>
          </div>
          <div class="grid grid-cols-2 gap-4 text-sm">
            <div class="bg-white/5 rounded-2xl p-4"><p class="text-cyan-300">PPO₂</p><p class="text-xl">${ppo2} bar</p></div>
            <div class="bg-white/5 rounded-2xl p-4"><p class="text-cyan-300">FO₂</p><p class="text-xl">${o2}%</p></div>
          </div>`;
      } else {
        let ata = 1 + (depth / (isMetric ? 10 : 3.28084));
        const fo2 = ppo2 / ata;
        o2 = Math.floor(fo2 * 100);

        resultHTML = `
          <div class="bg-emerald-900/60 rounded-2xl p-6">
            <p class="text-emerald-300 text-sm">${t.bestMixTitle}</p>
            <p class="text-6xl font-bold text-white">${o2}<span class="text-3xl">%</span></p>
          </div>
          <div class="bg-white/5 rounded-2xl p-6">
            <p class="text-cyan-300">Max Depth</p>
            <p class="text-4xl">${depth} ${isMetric ? 'm' : 'ft'}</p>
          </div>`;
      }

      document.getElementById('results').innerHTML = resultHTML;
    }

    const tooltip = document.getElementById('tooltip');
    const disclaimerBtn = document.getElementById('disclaimer-btn');
    disclaimerBtn.addEventListener('mouseenter', () => tooltip.style.display = 'block');
    disclaimerBtn.addEventListener('mouseleave', () => tooltip.style.display = 'none');

    document.querySelectorAll('input').forEach(el => el.addEventListener('input', calculate));

    window.onload = () => {
      setMode(1);
      setPPO2(1.4);
      setLanguage('ca');
      setUnit(true);
    };
  </script>
</body>
</html>
